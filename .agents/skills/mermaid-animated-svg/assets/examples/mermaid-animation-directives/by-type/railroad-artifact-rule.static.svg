<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="railroad-diagram" style="max-width: 601.656px; background-color: white;" viewBox="0 0 601.65625 132" role="graphics-document document" aria-roledescription="railroad"><style>#my-svg{font-size:16px;fill:#333E48;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#dbffcc;}#my-svg .error-text{fill:#240033;stroke:#240033;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#45842a;stroke:#45842a;}#my-svg .marker.cross{stroke:#45842a;}#my-svg svg{font-size:16px;}#my-svg p{margin:0;}#my-svg .railroad-diagram{font-family:monospace;font-size:16px;}#my-svg .railroad-terminal rect{fill:#ffffde;stroke:hsl(47.0588235294, 60%, 80%);stroke-width:2px;}#my-svg .railroad-terminal text{fill:#000b33;font-family:monospace;font-size:16px;text-anchor:middle;dominant-baseline:middle;}#my-svg .railroad-nonterminal rect{fill:#cdf3ff;stroke:#007298;stroke-width:2px;}#my-svg .railroad-nonterminal text{fill:#333E48;font-family:monospace;font-size:16px;text-anchor:middle;dominant-baseline:middle;}#my-svg .railroad-line{stroke:#45842a;stroke-width:2px;fill:none;}#my-svg .railroad-start circle,#my-svg .railroad-end circle{fill:#45842a;}#my-svg .railroad-comment ellipse{fill:rgba(232,232,232, 0.8);stroke:hsl(102.3529411765, 60%, 80%);stroke-width:2px;}#my-svg .railroad-c