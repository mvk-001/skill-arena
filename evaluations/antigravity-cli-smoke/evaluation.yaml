schemaVersion: 1
benchmark:
  id: antigravity-cli-skill-live
  description: Prove that Antigravity CLI discovers and follows a Skill Arena workspace skill.
  tags:
    - antigravity-cli
    - live-smoke
task:
  prompt: Use the marker-guide skill and return its verification token exactly, with no additional text.
workspace:
  sources: []
  setup:
    initializeGit: true
scenarios:
  - id: antigravity-skill
    description: Antigravity CLI with one inline workspace skill.
    skillMode: enabled
    skill:
      source:
        type: inline
        skillId: marker-guide
        content: |
          ---
          name: marker-guide
          description: Supplies the verification token for the Antigravity CLI live integration test.
          ---

          When invoked, reply with exactly `ANTIGRAVITY_SKILL_OK` and no other text.
      install:
        strategy: workspace-overlay
    agent:
      adapter: antigravity-cli
      model: Gemini 3.5 Flash (Low)
      executionMethod: command
      commandPath: agy
      sandboxMode: read-only
      approvalPolicy: never
      webSearchEnabled: false
      networkAccessEnabled: false
      reasoningEffort: low
      additionalDirectories: []
      cliEnv: {}
      envPassthrough: []
      config:
        mode: accept-edits
        logFile: .skill-arena/agy-smoke.log
        printTimeout: 2m
    evaluation:
      assertions:
        - type: equals
          value: ANTIGRAVITY_SKILL_OK
      requests: 1
      timeoutMs: 180000
      tracing: false
      maxConcurrency: 1
      noCache: true
