schemaVersion: 1
benchmark:
  id: skill-evolution-strategies
  description: Compare four skill-improvement workflows on identical corpus-derived evidence tasks.
  tags:
    - compare
    - skill-evolution
    - strategy
task:
  prompts:
    - id: scalar-converter
      description: Stable scalar-fitness converter case.
      prompt: >-
        Select an improvement for subjects/animated-svg-to-gif/SKILL.md from
        evidence/stable-scalar-converter.json. Return one JSON object with strategy,
        selectedCandidateId, evidence, rejectedAlternative, developmentDecision, holdoutRule,
        and promotionDecision.
      evaluation:
        assertions:
          - type: javascript
            value: |
              const text = output.trim().replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/, "");
              const data = JSON.parse(text);
              const expected = {
                "population-search": "scalar-contract",
                "trace-distillation": "trace-exact-output",
                "reflective-pareto-search": "pareto-balanced",
                "operator-coevolution": "scalar-contract",
              };
              return data.selectedCandidateId === expected[context?.providerResponse?.metadata?.profileId];
    - id: heterogeneous-orchestrator
      description: Heterogeneous multi-case orchestration case.
      prompt: >-
        Resolve the case trade-offs for subjects/compose-synchronized-svg/SKILL.md using
        evidence/heterogeneous-svg-orchestration.json. Respond with JSON containing strategy,
        selectedCandidateId, supporting evidence, one rejectedAlternative, developmentDecision,
        holdoutRule, and promotionDecision.
      evaluation:
        assertions:
          - type: javascript
            value: |
              const text = output.trim().replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/, "");
              const data = JSON.parse(text);
              const expected = {
                "population-search": "scalar-overfit",
                "trace-distillation": "trace-brief-gate",
                "reflective-pareto-search": "pareto-balanced",
                "operator-coevolution": "scalar-overfit",
              };
              return data.selectedCandidateId === expected[context?.providerResponse?.metadata?.profileId];
    - id: recurring-findings
      description: Recurrent labeled trace evidence case.
      prompt: >-
        Use the recurring signals in evidence/recurring-composition-findings.json to improve
        subjects/d3-composition-evaluator/SKILL.md. Return JSON naming strategy,
        selectedCandidateId, trace evidence, a weaker rejectedAlternative, developmentDecision,
        holdoutRule, and promotionDecision.
      evaluation:
        assertions:
          - type: javascript
            value: |
              const text = output.trim().replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/, "");
              const data = JSON.parse(text);
              const expected = {
                "population-search": "scalar-overfit",
                "trace-distillation": "trace-reconciled-score",
                "reflective-pareto-search": "pareto-balanced",
                "operator-coevolution": "scalar-overfit",
              };
              return data.selectedCandidateId === expected[context?.providerResponse?.metadata?.profileId];
    - id: operator-plateau
      description: Repeated-generation operator plateau case.
      prompt: >-
        The mutations for subjects/html-d3-anime-video-workflow/SKILL.md have plateaued. Analyze
        evidence/plateaued-video-mutations.json. Reply with JSON containing strategy,
        selectedCandidateId, operator evidence, rejectedAlternative, developmentDecision,
        holdoutRule, and promotionDecision.
      evaluation:
        assertions:
          - type: javascript
            value: |
              const text = output.trim().replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/, "");
              const data = JSON.parse(text);
              const expected = {
                "population-search": "scalar-overfit",
                "trace-distillation": "trace-render-gate",
                "reflective-pareto-search": "operator-child-a",
                "operator-coevolution": "scalar-overfit",
              };
              const profileId = context?.providerResponse?.metadata?.profileId;
              const operatorEvidence = data.operatorEvidence ?? data["operator evidence"];
              const hasEvolvedElite = profileId !== "operator-coevolution"
                || JSON.stringify(operatorEvidence ?? {}).includes("evolved");
              return data.selectedCandidateId === expected[profileId] && hasEvolvedElite;
workspace:
  sources:
    - id: corpus-snapshot
      type: local-path
      path: evaluations/skill-evolution-strategies/fixtures/workspaces/base
      target: /
  setup:
    initializeGit: true
evaluation:
  assertions:
    - type: javascript
      value: |
        const text = output.trim().replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/, "");
        const data = JSON.parse(text);
        const strategy = data.strategy ?? data.appliedStrategy ?? data.method;
        const evidence = data.evidence ?? data.scoreEvidence ?? data.supportingEvidence
          ?? data.supportingCases ?? data.traceEvidence ?? data.operatorEvidence
          ?? data["supporting evidence"] ?? data["operator evidence"];
        const rejected = data.rejectedAlternative ?? data.oneRejectedAlternative
          ?? data.weakerRejectedAlternative ?? data["one rejectedAlternative"];
        return Boolean(
          strategy
          && data.selectedCandidateId
          && evidence
          && rejected
          && data.developmentDecision
          && data.holdoutRule
          && data.promotionDecision
        );
  requests: 1
  timeoutMs: 240000
  maxConcurrency: 4
  tracing: false
  noCache: true
comparison:
  profiles:
    - id: population-search
      description: Fixed scalar-fitness population search.
      isolation:
        inheritSystem: false
      capabilities:
        skills:
          - source:
              type: local-path
              path: skills/skill-arena-population-search
              skillId: skill-arena-population-search
            install:
              strategy: workspace-overlay
    - id: trace-distillation
      description: Prevalence-based consolidation from labeled traces.
      isolation:
        inheritSystem: false
      capabilities:
        skills:
          - source:
              type: local-path
              path: skills/skill-arena-trace-distillation
              skillId: skill-arena-trace-distillation
            install:
              strategy: workspace-overlay
    - id: reflective-pareto-search
      description: Per-case reflection with Pareto archive selection.
      isolation:
        inheritSystem: false
      capabilities:
        skills:
          - source:
              type: local-path
              path: skills/skill-arena-reflective-pareto-search
              skillId: skill-arena-reflective-pareto-search
            install:
              strategy: workspace-overlay
    - id: operator-coevolution
      description: Joint skill-candidate and mutation-operator evolution.
      isolation:
        inheritSystem: false
      capabilities:
        skills:
          - source:
              type: local-path
              path: skills/skill-arena-operator-coevolution
              skillId: skill-arena-operator-coevolution
            install:
              strategy: workspace-overlay
  variants:
    - id: codex-gpt54
      description: Local Codex GPT-5.4 comparison variant.
      agent:
        adapter: codex
        model: gpt-5.4
        executionMethod: command
        commandPath: codex
        sandboxMode: read-only
        approvalPolicy: never
        webSearchEnabled: false
        networkAccessEnabled: false
        reasoningEffort: low
        additionalDirectories: []
        cliEnv: {}
        envPassthrough: []
        config: {}
